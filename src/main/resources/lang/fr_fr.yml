# Confirmations : titre, texte, bouton
confirm:
  claim-many:
    title: "<primary>Prendre <count> chunk(s)"
    body: "Payés <price> par la réserve du clan. Chaque chunk payant ajoute aussi à l'entretien de la semaine."
    button: "Prendre (<price>)"
  heart:
    title: "<primary>Déplacer le cœur ici"
    body: "Le chunk où tu es devient le chunk primaire : le carré de 3 × 3 autour devient gratuit et sans entretien. Coût : <price>, une fois tous les <days> jours."
    button: "Déplacer (<price>)"
  abandon:
    title: "<primary>Rendre tout le terrain"
    body: "Les <count> chunks du clan redeviennent libres (cœur compris), et ses parcelles sont supprimées. Une part du prix des chunks payants revient dans la réserve."
    button: "Tout rendre"
  revoke:
    title: "<primary>Retirer l'accès de <player>"
    body: "Il ne pourra plus entrer ni agir sur le terrain. Ce qu'il restait de son pass lui est rendu, pris sur la réserve."
    button: "Retirer"
  claim:
    title: "<primary>Prendre ce chunk"
    body: "Ici : <kind>. Payé <price> par la réserve du clan. Le premier chunk devient le cœur : les 3 × 3 chunks autour sont pris avec lui, gratuits et sans entretien."
    button: "Prendre (<price>)"
  unclaim:
    title: "<primary>Rendre ce chunk"
    body: "Le chunk où tu es redevient libre ; une part de son prix revient dans la réserve. Les parcelles non louées dessus sont supprimées."
    button: "Rendre"
  disband:
    title: "<primary>Dissoudre <clan>"
    body: "Chaque membre récupère son compte, tout le terrain est libéré, et la réserve (<reserve>) est PERDUE."
    button: "Dissoudre"
  leave:
    title: "<primary>Quitter <clan>"
    body: "Ton compte du clan te sera rendu ; tes locations de parcelles s'arrêtent."
    button: "Quitter"
  kick:
    title: "<primary>Exclure <player>"
    body: "Son compte (<amount>) lui sera rendu ; ses locations de parcelles s'arrêtent."
    button: "Exclure"
  transfer:
    title: "<primary>Céder le clan"
    body: "<player> deviendra le chef du clan, avec toutes les permissions. Tu redeviens un membre."
    button: "Céder"
  pass-buy:
    title: "<primary>Pass · <zone>"
    body: "<price> pour <days> jour(s) d'accès au terrain de <clan> (un pass en cours est prolongé). L'argent va à la réserve du clan."
    button: "Acheter (<price>)"
  zone-take:
    title: "<primary>Louer <zone>"
    body: "<rent> tout de suite, puis chaque semaine (versés à la réserve). Toi seul y construiras, avec ceux que tu choisis."
    button: "Louer (<rent>)"
  zone-leave:
    title: "<primary>Quitter <zone>"
    body: "La location s'arrête : la parcelle revient au clan, avec ce que tu y as laissé."
    button: "Quitter"
  zone-delete:
    title: "<primary>Supprimer <zone>"
    body: "La parcelle disparaît (le terrain reste au clan)."
    button: "Supprimer"
  zone-evict:
    title: "<primary>Mettre fin à la location"
    body: "<tenant> ne loue plus <zone> : la parcelle revient au clan."
    button: "Mettre fin"

