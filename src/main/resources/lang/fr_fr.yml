# Messages d'EterClan, format MiniMessage : https://docs.advntr.dev/minimessage/format
# Balises de la palette (EterLib/config.yml > language.colors) : <primary> <accent> <info> <error> <success>
#   <info> = texte courant gris clair, <accent> = mots importants en orange.
# Une clé absente reprend le texte intégré au plugin : tu peux ne garder que les lignes que tu modifies.
# Le préfixe des messages (« Core ») est commun à tous les plugins : EterLib/config.yml > language.prefix.

# Badge qui remplace le grade (Tab, chat, pseudo) pour les membres d'un clan : <tag> = le tag du clan.
badge: "<accent>[<tag>]</accent> "

clan:
  usage: "<info>Commandes : <accent>/clan</accent> (menu), create, invite, accept, leave, kick, transfer, disband, claim, unclaim, here, deposit, withdraw, give, take, interest, display, zone."
  help-no-clan: "<info>Tu n'as pas de clan. Crée le tien avec <accent>/clan create \\<nom> \\<TAG></accent>, ou accepte une invitation avec <accent>/clan accept</accent>."
  none: "<error>Tu n'as pas de clan : <accent>/clan create \\<nom> \\<TAG>"
  create-usage: "<error>Utilisation : <accent>/clan create \\<nom> \\<TAG></accent> (nom de 3 à 24 caractères, tag de 2 à 5 lettres ou chiffres)."
  already: "<error>Tu es déjà dans un clan."
  name-taken: "<error>Ce nom ou ce tag est déjà pris."
  create-not-enough: "<error>Il te faut <accent><price></accent> pour créer un clan."
  created: "<success>Clan <accent><clan></accent> <dark_gray>[<tag>]</dark_gray> créé !</success> <info>Prends ton premier terrain avec <accent>/clan claim</accent>."
  no-permission: "<error>Ton clan ne t'a pas donné cette permission."
  target-in-clan: "<error><accent><player></accent> est déjà dans un clan."
  invite-sent: "<info>Invitation envoyée à <accent><player></accent> (5 minutes pour accepter)."
  invited: "<info><accent><player></accent> t'invite dans le clan <accent><clan></accent> : <accent><click:run_command:'/clan accept'>/clan accept</click></accent> pour le rejoindre."
  no-invite: "<error>Tu n'as pas d'invitation en cours (ou elle a expiré)."
  joined: "<success>Tu as rejoint le clan <accent><clan></accent> !"
  member-joined: "<info><accent><player></accent> a rejoint ton clan."
  owner-cannot-leave: "<error>Le chef ne peut pas partir : cède le clan (<accent>/clan transfer</accent>) ou dissous-le (<accent>/clan disband</accent>)."
  left: "<info>Tu as quitté le clan <accent><clan></accent> ; ton compte t'a été rendu."
  not-member: "<error><accent><player></accent> n'est pas dans ton clan."
  cannot-kick-owner: "<error>On ne peut pas exclure le chef."
  kicked: "<info><accent><player></accent> a été exclu du clan ; son compte lui a été rendu."
  you-were-kicked: "<error>Tu as été exclu du clan <accent><clan></accent>.</error> <info>Ton compte t'a été rendu."
  owner-only: "<error>Seul le chef du clan peut faire ça."
  transferred: "<info><accent><player></accent> est maintenant le chef du clan."
  you-are-owner: "<success>Tu es maintenant le chef du clan <accent><clan></accent> !"
  disband-confirm: "<error>Dissoudre le clan rend à chacun son compte, libère tout le terrain et PERD la réserve. Confirme avec <accent>/clan disband confirm</accent>."
  disbanded: "<info>Le clan <accent><clan></accent> est dissous."
  disbanded-notice: "<error>Le clan <accent><clan></accent> a été dissous.</error> <info>Ton compte t'a été rendu."
  owner-has-all: "<error>Le chef a toutes les permissions."
  display-rank: "<info>Tu affiches maintenant ton <accent>grade</accent> (Tab, chat, pseudo)."
  display-clan: "<info>Tu affiches maintenant le tag de ton clan <accent>[<tag>]</accent> (Tab, chat, pseudo)."
  display-staff: "<info>Choix enregistré, mais en tant que staff tu gardes toujours ton <accent>grade</accent>."

bank:
  amount-invalid: "<error>Montant invalide."
  not-enough: "<error>Tu n'as pas <accent><amount></accent> sur toi."
  account-not-enough: "<error>Ton compte n'a pas <accent><amount></accent>."
  reserve-not-enough: "<error>La réserve n'a pas <accent><amount></accent>."
  deposited: "<info><accent><amount></accent> rangés sur ton compte du clan (à l'abri de la mort)."
  withdrawn: "<info><accent><amount></accent> repris de ton compte du clan."
  reserve-given: "<info><accent><amount></accent> donnés à la réserve du clan."
  reserve-taken: "<info><accent><amount></accent> pris dans la réserve du clan."
  interest-invalid: "<error>Taux invalide : entre <accent>0</accent> et <accent><max> %</accent>."
  interest-set: "<info>Intérêt du clan : <accent><rate> %</accent> par semaine, versé à la réserve."
  chunks-lost: "<error>Ton clan n'a pas pu payer l'entretien de son terrain : <accent><count></accent> chunk(s) perdu(s)."

claim:
  denied: "<error>Tu n'as pas la permission ici : <accent><permission>"
  world-forbidden: "<error>On ne peut pas prendre de terrain dans ce monde."
  disabled-here: "<error>On ne prend pas de terrain sur ce serveur."
