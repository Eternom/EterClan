  done: "<info>Parcelle de <accent><width> × <depth></accent> (<accent><area></accent> blocs)."
  confirm: "<success><bold>[Valider]</bold></success>"
  restart: "<accent><bold>[Recommencer]</bold></accent>"
  cancel: "<error><bold>[Annuler]</bold></error>"
  restarted: "<info>On recommence : clique le premier coin."
  cancelled: "<info>Parcelle annulée."
  expired: "<info>Parcelle abandonnée (3 minutes sans valider)."

