    body: "Ton argent sur ton compte du clan est à l'abri de la mort. Chaque semaine, l'intérêt du clan en reverse une part à la réserve."
  withdraw:
    title: "<primary>Reprendre de l'argent"
    body: "Combien reprendre de ton compte du clan ?"
  give:
    title: "<primary>Donner à la réserve"
    body: "La réserve paie les chunks et l'entretien du terrain."
  take:
