  rent-failed: "<error>Tu n'as pas pu payer le loyer de <accent><zone></accent> : la location est terminée."
  not-tenant: "<error>Tu ne loues pas la parcelle <accent><zone></accent>."
  trusted: "<info><accent><player></accent> peut maintenant construire et ouvrir dans <accent><zone></accent>."
  untrusted: "<info><accent><player></accent> n'a plus accès à <accent><zone></accent>."
  list-empty: "<info>Ton clan n'a pas de parcelle."
  list-header: "<info>Parcelles du clan (<accent><count></accent>) :"
  list-free: "<dark_gray>▸ <accent><zone></accent> <info>(<area> blocs) : au clan"
  list-for-rent: "<dark_gray>▸ <accent><zone></accent> <info>(<area> blocs) : à louer <accent><rent></accent>/semaine"
  list-rented: "<dark_gray>▸ <accent><zone></accent> <info>(<area> blocs) : louée par <accent><tenant></accent>, <rent>/semaine"

