    body: "Combien reprendre de ton compte du clan ?"
  give:
    title: "<primary>Donner à la réserve"
    body: "La réserve paie les chunks et l'entretien du terrain."
  take:
    title: "<primary>Prendre dans la réserve"
    body: "Combien prendre dans la réserve du clan ?"
  interest:
    title: "<primary>Intérêt du clan"
    body: "Pourcentage pris chaque semaine sur le compte de chaque membre et versé à la réserve (0 à <max> %)."
  rent:
    title: "<primary>Loyer de la parcelle"
    body: "Loyer par semaine, versé à la réserve du clan (0 = plus à louer)."
  invite:
    title: "<primary>Inviter un joueur"
    body: "Son pseudo : il recevra une invitation valable 5 minutes."
    label: "Pseudo"
  trust:
    title: "<primary>Donner l'accès"
    body: "Ce joueur pourra construire et ouvrir les coffres dans ta parcelle."
    label: "Pseudo"
  zone-name:
    title: "<primary>Nom de la parcelle"
    body: "2 à 24 lettres, chiffres, - ou _ (ex : maison-pierre)."
    label: "Nom"

# Confirmations : titre, texte, bouton
confirm:
  claim:
    title: "<primary>Prendre ce chunk"
    body: "Payé <price> par la réserve du clan. L'entretien de votre terrain passera à <upkeep> par semaine."
    button: "Prendre (<price>)"
  unclaim:
    title: "<primary>Rendre ce chunk"
    body: "Le chunk où tu es redevient libre, sans remboursement. Les parcelles non louées dessus sont supprimées."
    button: "Rendre"
  disband:
    title: "<primary>Dissoudre <clan>"
    body: "Chaque membre récupère son compte, tout le terrain est libéré, et la réserve (<reserve>) est PERDUE."
    button: "Dissoudre"
  leave:
    title: "<primary>Quitter <clan>"
    body: "Ton compte du clan te sera rendu ; tes locations de parcelles s'arrêtent."
    button: "Quitter"
  kick:
    title: "<primary>Exclure <player>"
    body: "Son compte (<amount>) lui sera rendu ; ses locations de parcelles s'arrêtent."
    button: "Exclure"
  transfer:
    title: "<primary>Céder le clan"
    body: "<player> deviendra le chef du clan, avec toutes les permissions. Tu redeviens un membre."
    button: "Céder"
  zone-take:
    title: "<primary>Louer <zone>"
    body: "<rent> tout de suite, puis chaque semaine (versés à la réserve). Toi seul y construiras, avec ceux que tu choisis."
    button: "Louer (<rent>)"
  zone-leave:
    title: "<primary>Quitter <zone>"
    body: "La location s'arrête : la parcelle revient au clan, avec ce que tu y as laissé."
    button: "Quitter"
  zone-delete:
    title: "<primary>Supprimer <zone>"
    body: "La parcelle disparaît (le terrain reste au clan)."
    button: "Supprimer"
  zone-evict:
    title: "<primary>Mettre fin à la location"
    body: "<tenant> ne loue plus <zone> : la parcelle revient au clan."
    button: "Mettre fin"

