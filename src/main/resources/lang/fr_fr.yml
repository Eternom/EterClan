  not-yours: "<error>Ce chunk n'est pas à ton clan."
  rented-zone: "<error>Une parcelle louée est sur ce chunk : la location doit d'abord finir."
  unclaimed: "<info>Chunk rendu (sans remboursement)."
  here: "<info>Ici : terrain du clan <accent><clan></accent>."
  here-wild: "<info>Ici : <accent>nature sauvage</accent>, personne ne possède ce chunk."
  next-price: "<info>Ton clan a <accent><chunks></accent> chunk(s) (<accent><free></accent> gratuits). Prochain : <accent><price></accent> ; entretien actuel : <accent><upkeep></accent> par semaine."

land:
  wild: "<info>Nature sauvage"
  clan: "<info>Terrain de <accent><clan>"
  zone: "<info>Parcelle <accent><zone></accent> <dark_gray>·</dark_gray> <info><clan>"
  zone-rented: "<info>Parcelle <accent><zone></accent> de <accent><tenant></accent> <dark_gray>·</dark_gray> <info><clan>"

zone:
  usage: "<info>Parcelles : <accent>/clan zone pos1</accent>, <accent>pos2</accent> (les deux coins, le bloc visé), <accent>create \\<nom></accent>, <accent>delete \\<nom></accent>, <accent>rent \\<nom> \\<loyer></accent>, <accent>take \\<nom></accent> (louer), <accent>end \\<nom></accent>, <accent>trust \\<nom> \\<joueur></accent>, <accent>untrust</accent>, <accent>list</accent>."
