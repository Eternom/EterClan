  created: "<success>Clan <accent><clan></accent> <dark_gray>[<tag>]</dark_gray> créé !</success> <info>Payé <accent><price></accent>. Ouvre <accent><click:run_command:'/clan'>/clan</click></accent> pour prendre ton premier terrain."
