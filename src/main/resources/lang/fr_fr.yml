  created: "<success>Parcelle <accent><zone></accent> créée</success> <info>(<accent><area></accent> blocs). Mets-la en location avec <accent>/clan zone rent <zone> \\<loyer></accent>."
  unknown: "<error>Pas de parcelle <accent><zone></accent> dans ton clan."
  deleted: "<info>Parcelle <accent><zone></accent> supprimée."
  rented-cannot-delete: "<error>La parcelle <accent><zone></accent> est louée : la location doit d'abord finir."
  rented-locked: "<error>La parcelle <accent><zone></accent> est louée : son loyer ne change pas pendant la location."
  rent-set: "<info>Parcelle <accent><zone></accent> à louer : <accent><rent></accent> par semaine."
