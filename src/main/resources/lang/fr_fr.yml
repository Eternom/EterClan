  not-for-rent: "<error>La parcelle <accent><zone></accent> n'est pas à louer (ou déjà louée)."
  rent-not-enough: "<error>Il te faut <accent><rent></accent> pour la première semaine."
  rented: "<success>Tu loues la parcelle <accent><zone></accent> !</success> <info><accent><rent></accent> par semaine, versés à la réserve. Toi seul y construis : <accent>/clan zone trust <zone> \\<joueur></accent> pour inviter."
