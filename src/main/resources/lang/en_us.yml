# Confirmations: title, text, button
confirm:
  claim-many:
    title: "<primary>Claim <count> chunk(s)"
    body: "Paid <price> by the clan reserve. Each paid chunk also adds to the weekly upkeep."
    button: "Claim (<price>)"
  heart:
    title: "<primary>Move the core here"
    body: "The chunk you stand in becomes the main chunk: the 3 × 3 square around it becomes free with no upkeep. Cost: <price>, once every <days> days."
    button: "Move (<price>)"
  abandon:
    title: "<primary>Give up all the land"
    body: "The clan's <count> chunks become free (core included), and its plots are deleted. Part of the price of paid chunks returns to the reserve."
    button: "Give up everything"
  revoke:
    title: "<primary>Remove <player>'s access"
    body: "They can no longer enter or act on the land. What was left of their pass is given back, taken from the reserve."
    button: "Remove"
  claim:
    title: "<primary>Take this chunk"
    body: "Here: <kind>. Paid <price> by the clan reserve. The first chunk becomes the core: the 3 × 3 chunks around it are claimed with it, free with no upkeep."
    button: "Take (<price>)"
  unclaim:
    title: "<primary>Give up this chunk"
    body: "The chunk you stand in becomes free again; part of its price returns to the reserve. Non-rented plots on it are deleted."
    button: "Give up"
  disband:
    title: "<primary>Disband <clan>"
    body: "Every member gets their account back, all the land is freed, and the reserve (<reserve>) is LOST."
    button: "Disband"
  leave:
    title: "<primary>Leave <clan>"
    body: "Your clan account will be given back to you; your plot rentals end."
    button: "Leave"
  kick:
    title: "<primary>Kick <player>"
    body: "Their account (<amount>) will be given back to them; their plot rentals end."
    button: "Kick"
  transfer:
    title: "<primary>Give the clan away"
    body: "<player> will become the clan leader, with every permission. You become a member."
    button: "Give away"
  pass-buy:
    title: "<primary>Pass · <zone>"
    body: "<price> for <days> day(s) of access to <clan>'s land (a running pass is extended). The money goes to the clan reserve."
    button: "Buy (<price>)"
  zone-take:
    title: "<primary>Rent <zone>"
    body: "<rent> now, then every week (paid to the reserve). Only you will build there, with whoever you choose."
    button: "Rent (<rent>)"
  zone-leave:
    title: "<primary>Leave <zone>"
    body: "The rental ends: the plot goes back to the clan, with whatever you left in it."
    button: "Leave"
  zone-delete:
    title: "<primary>Delete <zone>"
    body: "The plot disappears (the land stays the clan's)."
    button: "Delete"
  zone-evict:
    title: "<primary>End the rental"
    body: "<tenant> no longer rents <zone>: the plot goes back to the clan."
    button: "End"

