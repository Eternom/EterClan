# EterClan messages, MiniMessage format: https://docs.advntr.dev/minimessage/format
# Palette tags (EterLib/config.yml > language.colors): <primary> <accent> <info> <error> <success>
#   <info> = regular light gray text, <accent> = important words in orange.
# A missing key falls back to the text bundled in the plugin: keep only the lines you change.
# The message prefix ("Core") is shared by all plugins: EterLib/config.yml > language.prefix.
# Everything is done in the /clan menu: texts talk about its buttons, not commands.

# Badge that replaces the rank (Tab, chat, name tag) for clan members: <tag> = the clan tag.
badge: "<gray>[<tag>]</gray> "

clan:
  role-applied: "<info><accent><player></accent> now has the role <accent><role></accent>."
  none: "<error>You have no clan: open <accent><click:run_command:'/clan'>/clan</click></accent> to create one or accept an invite."
  create-usage: "<error>Name of 3 to 24 characters, tag of 2 to 5 letters or digits."
  already: "<error>You are already in a clan."
  name-taken: "<error>That name or tag is already taken."
  create-not-enough: "<error>You need <accent><price></accent> to create a clan."
  created: "<success>Clan <accent><clan></accent> <dark_gray>[<tag>]</dark_gray> created!</success> <info>Paid <accent><price></accent>. Open <accent><click:run_command:'/clan'>/clan</click></accent> to take your first land."
  no-permission: "<error>Your clan didn't give you this permission."
  target-in-clan: "<error><accent><player></accent> is already in a clan."
  invite-sent: "<info>Invite sent to <accent><player></accent> (5 minutes to accept)."
  invited: "<info><accent><player></accent> invites you to the clan <accent><clan></accent>: open <accent><click:run_command:'/clan'>/clan</click></accent> to accept."
  no-invite: "<error>You have no pending invite (or it expired)."
  joined: "<success>You joined the clan <accent><clan></accent>!"
  member-joined: "<info><accent><player></accent> joined your clan."
  owner-cannot-leave: "<error>The leader can't leave: give the clan to a member first, or disband it."
  left: "<info>You left the clan <accent><clan></accent>; your account was given back to you."
  not-member: "<error><accent><player></accent> is not in your clan."
  cannot-kick-owner: "<error>The leader can't be kicked."
  kicked: "<info><accent><player></accent> was kicked from the clan; their account was given back."
  you-were-kicked: "<error>You were kicked from the clan <accent><clan></accent>.</error> <info>Your account was given back to you."
  owner-only: "<error>Only the clan leader can do that."
  transferred: "<info><accent><player></accent> is now the clan leader."
  you-are-owner: "<success>You are now the leader of the clan <accent><clan></accent>!"
  disbanded: "<info>The clan <accent><clan></accent> is disbanded."
  disbanded-notice: "<error>The clan <accent><clan></accent> was disbanded.</error> <info>Your account was given back to you."
  owner-has-all: "<error>The leader has every permission."
  display-rank: "<info>You now show your <accent>rank</accent> (Tab, chat, name tag)."
  display-clan: "<info>You now show your clan tag <accent>[<tag>]</accent> (Tab, chat, name tag)."
  display-staff: "<info>Choice saved, but as staff you always keep your <accent>rank</accent>."

