  rented-zone: "<error>A rented plot is on this chunk: the rental must end first."
  unclaimed: "<info>Chunk given up. Refunded: <accent><refund></accent> to the reserve."
  here: "<info>Here: land of the clan <accent><clan></accent>."
  here-wild: "<info>Here: <accent>wilderness</accent>, nobody owns this chunk."
