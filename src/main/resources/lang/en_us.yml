  first: "<info>First corner: <accent><x>, <z></accent>. Now click the second one."
  done: "<info>Plot of <accent><width> × <depth></accent> (<accent><area></accent> blocks)."
  confirm: "<success><bold>[Confirm]</bold></success>"
  restart: "<accent><bold>[Start over]</bold></accent>"
  cancel: "<error><bold>[Cancel]</bold></error>"
  restarted: "<info>Starting over: click the first corner."
  cancelled: "<info>Plot cancelled."
  expired: "<info>Plot abandoned (3 minutes without confirming)."

