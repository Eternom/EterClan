# EterClan messages, MiniMessage format: https://docs.advntr.dev/minimessage/format
# Palette tags (EterLib/config.yml > language.colors): <primary> <accent> <info> <error> <success>
#   <info> = regular light gray text, <accent> = important words in orange.
# A missing key falls back to the text bundled in the plugin: keep only the lines you change.
# The message prefix ("Core") is shared by all plugins: EterLib/config.yml > language.prefix.

# Badge that replaces the rank (Tab, chat, name tag) for clan members: <tag> = the clan tag.
badge: "<accent>[<tag>]</accent> "

clan:
  usage: "<info>Commands: <accent>/clan</accent> (menu), create, invite, accept, leave, kick, transfer, disband, claim, unclaim, here, deposit, withdraw, give, take, interest, display, zone."
  help-no-clan: "<info>You have no clan. Create yours with <accent>/clan create \\<name> \\<TAG></accent>, or accept an invite with <accent>/clan accept</accent>."
  none: "<error>You have no clan: <accent>/clan create \\<name> \\<TAG>"
  create-usage: "<error>Usage: <accent>/clan create \\<name> \\<TAG></accent> (name of 3 to 24 characters, tag of 2 to 5 letters or digits)."
  already: "<error>You are already in a clan."
  name-taken: "<error>That name or tag is already taken."
  create-not-enough: "<error>You need <accent><price></accent> to create a clan."
  created: "<success>Clan <accent><clan></accent> <dark_gray>[<tag>]</dark_gray> created!</success> <info>Take your first land with <accent>/clan claim</accent>."
  no-permission: "<error>Your clan didn't give you this permission."
  target-in-clan: "<error><accent><player></accent> is already in a clan."
  invite-sent: "<info>Invite sent to <accent><player></accent> (5 minutes to accept)."
  invited: "<info><accent><player></accent> invites you to the clan <accent><clan></accent>: <accent><click:run_command:'/clan accept'>/clan accept</click></accent> to join."
  no-invite: "<error>You have no pending invite (or it expired)."
  joined: "<success>You joined the clan <accent><clan></accent>!"
  member-joined: "<info><accent><player></accent> joined your clan."
  owner-cannot-leave: "<error>The leader can't leave: give the clan away (<accent>/clan transfer</accent>) or disband it (<accent>/clan disband</accent>)."
  left: "<info>You left the clan <accent><clan></accent>; your account was given back to you."
  not-member: "<error><accent><player></accent> is not in your clan."
  cannot-kick-owner: "<error>The leader can't be kicked."
  kicked: "<info><accent><player></accent> was kicked from the clan; their account was given back."
  you-were-kicked: "<error>You were kicked from the clan <accent><clan></accent>.</error> <info>Your account was given back to you."
  owner-only: "<error>Only the clan leader can do that."
  transferred: "<info><accent><player></accent> is now the clan leader."
  you-are-owner: "<success>You are now the leader of the clan <accent><clan></accent>!"
  disband-confirm: "<error>Disbanding gives everyone their account back, frees all the land and LOSES the reserve. Confirm with <accent>/clan disband confirm</accent>."
  disbanded: "<info>The clan <accent><clan></accent> is disbanded."
  disbanded-notice: "<error>The clan <accent><clan></accent> was disbanded.</error> <info>Your account was given back to you."
  owner-has-all: "<error>The leader has every permission."
  display-rank: "<info>You now show your <accent>rank</accent> (Tab, chat, name tag)."
  display-clan: "<info>You now show your clan tag <accent>[<tag>]</accent> (Tab, chat, name tag)."
  display-staff: "<info>Choice saved, but as staff you always keep your <accent>rank</accent>."

bank:
  amount-invalid: "<error>Invalid amount."
  not-enough: "<error>You don't have <accent><amount></accent> on you."
  account-not-enough: "<error>Your account doesn't have <accent><amount></accent>."
  reserve-not-enough: "<error>The reserve doesn't have <accent><amount></accent>."
  deposited: "<info><accent><amount></accent> stored on your clan account (safe from death)."
  withdrawn: "<info><accent><amount></accent> taken back from your clan account."
  reserve-given: "<info><accent><amount></accent> given to the clan reserve."
  reserve-taken: "<info><accent><amount></accent> taken from the clan reserve."
  interest-invalid: "<error>Invalid rate: between <accent>0</accent> and <accent><max> %</accent>."
  interest-set: "<info>Clan interest: <accent><rate> %</accent> per week, paid to the reserve."
  chunks-lost: "<error>Your clan couldn't pay its land upkeep: <accent><count></accent> chunk(s) lost."

claim:
  denied: "<error>You don't have permission here: <accent><permission>"
  world-forbidden: "<error>Land can't be taken in this world."
  disabled-here: "<error>Land can't be taken on this server."
  already-yours: "<error>This chunk already belongs to your clan."
  taken: "<error>This chunk already belongs to a clan."
  not-adjacent: "<error>This chunk must touch your clan's land."
  reserve-not-enough: "<error>The clan reserve doesn't have <accent><price></accent> for this chunk (<accent>/clan give</accent> to fill it)."
  claimed: "<success>Chunk taken!</success> <info>Paid <accent><price></accent> by the reserve; land upkeep: <accent><upkeep></accent> per week."
  not-yours: "<error>This chunk isn't your clan's."
  rented-zone: "<error>A rented plot is on this chunk: the rental must end first."
  unclaimed: "<info>Chunk given up (no refund)."
  here: "<info>Here: land of the clan <accent><clan></accent>."
  here-wild: "<info>Here: <accent>wilderness</accent>, nobody owns this chunk."
  next-price: "<info>Your clan has <accent><chunks></accent> chunk(s) (<accent><free></accent> free). Next one: <accent><price></accent>; current upkeep: <accent><upkeep></accent> per week."

land:
  wild: "<info>Wilderness"
  clan: "<info>Land of <accent><clan>"
  zone: "<info>Plot <accent><zone></accent> <dark_gray>·</dark_gray> <info><clan>"
  zone-rented: "<info><accent><tenant></accent>'s plot <accent><zone></accent> <dark_gray>·</dark_gray> <info><clan>"

zone:
  usage: "<info>Plots: <accent>/clan zone pos1</accent>, <accent>pos2</accent> (both corners, the targeted block), <accent>create \\<name></accent>, <accent>delete \\<name></accent>, <accent>rent \\<name> \\<rent></accent>, <accent>take \\<name></accent> (rent it), <accent>end \\<name></accent>, <accent>trust \\<name> \\<player></accent>, <accent>untrust</accent>, <accent>list</accent>."
  pos1: "<info>First corner: <accent><x>, <z>"
  pos2: "<info>Second corner: <accent><x>, <z>"
  no-selection: "<error>Pick both corners first: <accent>/clan zone pos1</accent> and <accent>/clan zone pos2</accent>."
  name-invalid: "<error>Plot name: 2 to 24 letters, digits, - or _."
  too-big: "<error>Plot too big: <accent><max></accent> blocks at most."
  outside-land: "<error>The plot must be entirely inside your clan's land."
  overlaps: "<error>It overlaps another plot."
  name-taken: "<error>Your clan already has a plot <accent><zone></accent>."
  created: "<success>Plot <accent><zone></accent> created</success> <info>(<accent><area></accent> blocks). Put it up for rent with <accent>/clan zone rent <zone> \\<rent></accent>."
  unknown: "<error>No plot <accent><zone></accent> in your clan."
  deleted: "<info>Plot <accent><zone></accent> deleted."
  rented-cannot-delete: "<error>The plot <accent><zone></accent> is rented: the rental must end first."
  rented-locked: "<error>The plot <accent><zone></accent> is rented: its rent doesn't change during the rental."
  rent-set: "<info>Plot <accent><zone></accent> for rent: <accent><rent></accent> per week."
  rent-off: "<info>The plot <accent><zone></accent> is no longer for rent."
  not-for-rent: "<error>The plot <accent><zone></accent> isn't for rent (or is already rented)."
  rent-not-enough: "<error>You need <accent><rent></accent> for the first week."
  rented: "<success>You rent the plot <accent><zone></accent>!</success> <info><accent><rent></accent> per week, paid to the reserve. Only you build there: <accent>/clan zone trust <zone> \\<player></accent> to invite."
  not-rented: "<error>The plot <accent><zone></accent> isn't rented."
  ended: "<info>The rental of <accent><zone></accent> is over: the plot goes back to the clan."
  ended-by-clan: "<error>Your clan ended your rental of the plot <accent><zone></accent>."
  rent-failed: "<error>You couldn't pay the rent of <accent><zone></accent>: the rental is over."
  not-tenant: "<error>You don't rent the plot <accent><zone></accent>."
  trusted: "<info><accent><player></accent> can now build and open things in <accent><zone></accent>."
  untrusted: "<info><accent><player></accent> no longer has access to <accent><zone></accent>."
  list-empty: "<info>Your clan has no plots."
  list-header: "<info>Clan plots (<accent><count></accent>):"
  list-free: "<dark_gray>▸ <accent><zone></accent> <info>(<area> blocks): the clan's"
  list-for-rent: "<dark_gray>▸ <accent><zone></accent> <info>(<area> blocks): for rent <accent><rent></accent>/week"
  list-rented: "<dark_gray>▸ <accent><zone></accent> <info>(<area> blocks): rented by <accent><tenant></accent>, <rent>/week"

