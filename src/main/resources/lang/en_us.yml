# EterClan messages, MiniMessage format: https://docs.advntr.dev/minimessage/format
# Palette tags (EterLib/config.yml > language.colors): <primary> <accent> <info> <error> <success>
#   <info> = regular light gray text, <accent> = important words in orange.
# A missing key falls back to the text bundled in the plugin: keep only the lines you change.
# The message prefix ("Core") is shared by all plugins: EterLib/config.yml > language.prefix.
# Everything is done in the /clan menu: texts talk about its buttons, not commands.

# Badge that replaces the rank (Tab, chat, name tag) for clan members: <tag> = the clan tag.
badge: "<accent>[<tag>]</accent> "

clan:
  none: "<error>You have no clan: open <accent><click:run_command:'/clan'>/clan</click></accent> to create one or accept an invite."
  create-usage: "<error>Name of 3 to 24 characters, tag of 2 to 5 letters or digits."
  already: "<error>You are already in a clan."
  name-taken: "<error>That name or tag is already taken."
  create-not-enough: "<error>You need <accent><price></accent> to create a clan."
  created: "<success>Clan <accent><clan></accent> <dark_gray>[<tag>]</dark_gray> created!</success> <info>Paid <accent><price></accent>. Open <accent><click:run_command:'/clan'>/clan</click></accent> to take your first land."
  no-permission: "<error>Your clan didn't give you this permission."
  target-in-clan: "<error><accent><player></accent> is already in a clan."
  invite-sent: "<info>Invite sent to <accent><player></accent> (5 minutes to accept)."
  invited: "<info><accent><player></accent> invites you to the clan <accent><clan></accent>: open <accent><click:run_command:'/clan'>/clan</click></accent> to accept."
  no-invite: "<error>You have no pending invite (or it expired)."
  joined: "<success>You joined the clan <accent><clan></accent>!"
  member-joined: "<info><accent><player></accent> joined your clan."
  owner-cannot-leave: "<error>The leader can't leave: give the clan to a member first, or disband it."
  left: "<info>You left the clan <accent><clan></accent>; your account was given back to you."
  not-member: "<error><accent><player></accent> is not in your clan."
  cannot-kick-owner: "<error>The leader can't be kicked."
  kicked: "<info><accent><player></accent> was kicked from the clan; their account was given back."
  you-were-kicked: "<error>You were kicked from the clan <accent><clan></accent>.</error> <info>Your account was given back to you."
  owner-only: "<error>Only the clan leader can do that."
  transferred: "<info><accent><player></accent> is now the clan leader."
  you-are-owner: "<success>You are now the leader of the clan <accent><clan></accent>!"
  disbanded: "<info>The clan <accent><clan></accent> is disbanded."
  disbanded-notice: "<error>The clan <accent><clan></accent> was disbanded.</error> <info>Your account was given back to you."
  owner-has-all: "<error>The leader has every permission."
  display-rank: "<info>You now show your <accent>rank</accent> (Tab, chat, name tag)."
  display-clan: "<info>You now show your clan tag <accent>[<tag>]</accent> (Tab, chat, name tag)."
  display-staff: "<info>Choice saved, but as staff you always keep your <accent>rank</accent>."

bank:
  amount-invalid: "<error>Invalid amount."
  not-enough: "<error>You don't have <accent><amount></accent> on you."
  account-not-enough: "<error>Your account doesn't have <accent><amount></accent>."
  reserve-not-enough: "<error>The reserve doesn't have <accent><amount></accent>."
  deposited: "<info><accent><amount></accent> stored on your clan account (safe from death)."
  withdrawn: "<info><accent><amount></accent> taken back from your clan account."
  reserve-given: "<info><accent><amount></accent> given to the clan reserve."
  reserve-taken: "<info><accent><amount></accent> taken from the clan reserve."
  interest-invalid: "<error>Invalid rate: between <accent>0</accent> and <accent><max> %</accent>."
  interest-set: "<info>Clan interest: <accent><rate> %</accent> per week, paid to the reserve."
  chunks-lost: "<error>Your clan couldn't pay its land upkeep: <accent><count></accent> chunk(s) lost."

claim:
  denied: "<error>You don't have permission here: <accent><permission>"
  world-forbidden: "<error>Land can't be taken in this world."
  disabled-here: "<error>Land can't be taken on this server."
  already-yours: "<error>This chunk already belongs to your clan."
  taken: "<error>This chunk already belongs to a clan."
  not-adjacent: "<error>Your clan has a single territory: this chunk must touch one of its chunks."
  land-elsewhere: "<error>Your clan's territory is elsewhere (another server or world): new chunks go next to it."
  would-split: "<error>Giving up this chunk would cut your territory in two: give up a chunk on the edge instead."
  reserve-not-enough: "<error>The clan reserve doesn't have <accent><price></accent> for this chunk: give it money in the menu."
  claimed: "<success>Chunk taken!</success> <info>Paid <accent><price></accent> by the reserve; land upkeep: <accent><upkeep></accent> per week."
  not-yours: "<error>This chunk isn't your clan's."
  rented-zone: "<error>A rented plot is on this chunk: the rental must end first."
  unclaimed: "<info>Chunk given up (no refund)."
  here: "<info>Here: land of the clan <accent><clan></accent>."
  here-wild: "<info>Here: <accent>wilderness</accent>, nobody owns this chunk."
  next-price: "<info>Your clan has <accent><chunks></accent> chunk(s) (<accent><free></accent> free). Next one: <accent><price></accent>; current upkeep: <accent><upkeep></accent> per week."

land:
  wild: "<info>Wilderness"
  clan: "<info>Land of <accent><clan>"
  zone: "<info>Plot <accent><zone></accent> <dark_gray>·</dark_gray> <info><clan>"
  zone-rented: "<info><accent><tenant></accent>'s plot <accent><zone></accent> <dark_gray>·</dark_gray> <info><clan>"

zone:
  other-world: "<error>Both corners must be in the same world."
  name-invalid: "<error>Plot name: 2 to 24 letters, digits, - or _."
  too-big: "<error>Plot too big: <accent><max></accent> blocks at most."
  outside-land: "<error>The plot must be entirely inside your clan's land."
  overlaps: "<error>It overlaps another plot."
  name-taken: "<error>Your clan already has a plot <accent><zone></accent>."
  created: "<success>Plot <accent><zone></accent> created</success> <info>(<accent><area></accent> blocks). Set its rent in the menu to put it up for rent."
  deleted: "<info>Plot <accent><zone></accent> deleted."
  rented-cannot-delete: "<error>The plot <accent><zone></accent> is rented: the rental must end first."
  rented-locked: "<error>The plot <accent><zone></accent> is rented: its rent doesn't change during the rental."
  rent-set: "<info>Plot <accent><zone></accent> for rent: <accent><rent></accent> per week."
  rent-off: "<info>The plot <accent><zone></accent> is no longer for rent."
  not-for-rent: "<error>The plot <accent><zone></accent> isn't for rent (or is already rented)."
  rent-not-enough: "<error>You need <accent><rent></accent> for the first week."
  rented: "<success>You rent the plot <accent><zone></accent>!</success> <info><accent><rent></accent> per week, paid to the reserve. Only you build there: add whoever you want in \"Access\"."
  ended: "<info>The rental of <accent><zone></accent> is over: the plot goes back to the clan."
  ended-by-clan: "<error>Your clan ended your rental of the plot <accent><zone></accent>."
  rent-failed: "<error>You couldn't pay the rent of <accent><zone></accent>: the rental is over."
  not-tenant: "<error>You don't rent the plot <accent><zone></accent>."
  trusted: "<info><accent><player></accent> can now build and open things in <accent><zone></accent>."
  untrusted: "<info><accent><player></accent> no longer has access to <accent><zone></accent>."

# Drawing a plot: two clicked blocks, then buttons in the chat
selection:
  start: "<info>Click (left or right) the <accent>first corner</accent> of the plot, then the <accent>second</accent>. <accent><max></accent> blocks at most, inside the clan's land."
  first: "<info>First corner: <accent><x>, <z></accent>. Now click the second one."
  done: "<info>Plot of <accent><width> × <depth></accent> (<accent><area></accent> blocks)."
  confirm: "<success><bold>[Confirm]</bold></success>"
  restart: "<accent><bold>[Start over]</bold></accent>"
  cancel: "<error><bold>[Cancel]</bold></error>"
  restarted: "<info>Starting over: click the first corner."
  cancelled: "<info>Plot cancelled."
  expired: "<info>Plot abandoned (3 minutes without confirming)."

# Name of each permission (menus, messages) and its description
permission:
  build: "Build and break"
  containers: "Chests and containers"
  doors: "Doors and gates"
  redstone: "Buttons, levers and plates"
  crops: "Crops"
  animals: "Animals"
  invite: "Invite"
  kick: "Kick"
  claim: "Take and give up land"
  zones: "Manage plots"
  reserve: "Take from the reserve"
  interest: "Set the interest"
  permissions: "Manage permissions"
permission-lore:
  build: "<info>Place and break blocks on the land"
  containers: "<info>Open chests, furnaces, barrels..."
  doors: "<info>Open doors, trapdoors, gates"
  redstone: "<info>Buttons, levers, pressure plates"
  crops: "<info>Sow and harvest"
  animals: "<info>Hit, shear, milk, leash"
  invite: "<info>Invite players into the clan"
  kick: "<info>Kick members (not the leader)"
  claim: "<info>Take chunks (paid by the reserve) and give them up"
  zones: "<info>Create, delete, rent out plots"
  reserve: "<info>Take money out of the reserve"
  interest: "<info>Set the accounts' interest rate"
  permissions: "<info>Give and remove these permissions"

# Input windows
dialogs:
  confirm: "Confirm"
  amount: "Amount"
  deposit:
    title: "<primary>Store money"
    body: "Money on your clan account is safe from death. Every week, the clan interest sends part of it to the reserve."
  withdraw:
    title: "<primary>Take money back"
    body: "How much to take back from your clan account?"
  give:
    title: "<primary>Give to the reserve"
    body: "The reserve pays for chunks and land upkeep."
  take:
    title: "<primary>Take from the reserve"
    body: "How much to take from the clan reserve?"
  interest:
    title: "<primary>Clan interest"
    body: "Percentage taken every week from each member's account and paid to the reserve (0 to <max> %)."
  rent:
    title: "<primary>Plot rent"
    body: "Rent per week, paid to the clan reserve (0 = no longer for rent)."
  invite:
    title: "<primary>Invite a player"
    body: "Their name: they will get an invite valid for 5 minutes."
    label: "Player"
  trust:
    title: "<primary>Give access"
    body: "This player will be able to build and open chests in your plot."
    label: "Player"
  zone-name:
    title: "<primary>Plot name"
    body: "2 to 24 letters, digits, - or _ (e.g. peter-house)."
    label: "Name"

# Confirmations: title, text, button
confirm:
  claim:
    title: "<primary>Take this chunk"
    body: "Paid <price> by the clan reserve. Your land upkeep will become <upkeep> per week. A clan has a single territory: the first chunk goes anywhere, the next ones next to it."
    button: "Take (<price>)"
  unclaim:
    title: "<primary>Give up this chunk"
    body: "The chunk you stand in becomes free again, with no refund. Non-rented plots on it are deleted."
    button: "Give up"
  disband:
    title: "<primary>Disband <clan>"
    body: "Every member gets their account back, all the land is freed, and the reserve (<reserve>) is LOST."
    button: "Disband"
  leave:
    title: "<primary>Leave <clan>"
    body: "Your clan account will be given back to you; your plot rentals end."
    button: "Leave"
  kick:
    title: "<primary>Kick <player>"
    body: "Their account (<amount>) will be given back to them; their plot rentals end."
    button: "Kick"
  transfer:
    title: "<primary>Give the clan away"
    body: "<player> will become the clan leader, with every permission. You become a member."
    button: "Give away"
  zone-take:
    title: "<primary>Rent <zone>"
    body: "<rent> now, then every week (paid to the reserve). Only you will build there, with whoever you choose."
    button: "Rent (<rent>)"
  zone-leave:
    title: "<primary>Leave <zone>"
    body: "The rental ends: the plot goes back to the clan, with whatever you left in it."
    button: "Leave"
  zone-delete:
    title: "<primary>Delete <zone>"
    body: "The plot disappears (the land stays the clan's)."
    button: "Delete"
  zone-evict:
    title: "<primary>End the rental"
    body: "<tenant> no longer rents <zone>: the plot goes back to the clan."
    button: "End"

