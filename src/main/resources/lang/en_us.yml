    body: "Money on your clan account is safe from death. Every week, the clan interest sends part of it to the reserve."
  withdraw:
    title: "<primary>Take money back"
    body: "How much to take back from your clan account?"
  give:
    title: "<primary>Give to the reserve"
    body: "The reserve pays for chunks and land upkeep."
  take:
    title: "<primary>Take from the reserve"
    body: "How much to take from the clan reserve?"
  interest:
    title: "<primary>Clan interest"
    body: "Percentage taken every week from each member's account and paid to the reserve (0 to <max> %)."
  rent:
    title: "<primary>Plot rent"
    body: "Rent per week, paid to the clan reserve (0 = no longer for rent)."
  invite:
    title: "<primary>Invite a player"
