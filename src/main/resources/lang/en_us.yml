  reserve-not-enough: "<error>The clan reserve doesn't have <accent><price></accent> for this chunk: give it money in the menu."
  claimed: "<success>Chunk taken!</success> <info>Paid <accent><price></accent> by the reserve; land upkeep: <accent><upkeep></accent> per week."
